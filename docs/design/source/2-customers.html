<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>BOD Monitor — All customers</title>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap">
<style>
body{margin:0;background:#F3EFE6}
a{color:#1C1A17;text-decoration:none}a:hover{color:#9A5424}
</style>
</helmet>
<div style="width: 390px; height: 1500px; box-sizing: border-box; background: #F3EFE6; font-family: Inter, system-ui, sans-serif; color: #1C1A17; display: flex; flex-direction: column">

<header style="display: flex; align-items: center; gap: 6px; padding: 10px 16px 10px 6px; border-bottom: 1px solid #E2DBCD">
<a href="Main.dc.html" aria-label="Back to overview" style="flex: none; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #1C1A17"><svg width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
<div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 2px">
<h1 style="margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-size: 22px; font-weight: 400; line-height: 1.1">Customers <em style="font-style: italic; color: #6E675C">— BOD status</em></h1>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: #6E675C">17 brokers · updated 07:42</span>
</div>
<span style="display: inline-flex; align-items: center; padding: 5px 9px; border: 1px solid #B23B2E; background: #FBEAE7; color: #962F24; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase">Failed</span>
</header>

<div style="display: flex; flex-direction: column; gap: 12px; padding: 14px 16px 6px">
<label style="display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 14px; background: #FFFFFF; border: 1px solid #E2DBCD">
<svg width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="#5F594F" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4.5 4.5"></path></svg>
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search customers</span>
<input type="search" placeholder="Search customer" sc-camel-on-input="{{onSearch}}" style="flex: 1 1 auto; min-width: 0; border: 0; outline: none; background: transparent; font-family: Inter, sans-serif; font-size: 14px; color: #1C1A17">
</label>
<div role="group" aria-label="Filter by status" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid #E2DBCD; background: #E2DBCD; gap: 1px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
<button aria-pressed="{{t.on}}" sc-camel-on-click="{{t.pick}}" style="height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border: 0; cursor: pointer; background: {{t.bg}}; color: {{t.fg}}">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 700">{{t.n}}</span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase">{{t.label}}</span>
</button>
</sc-for>
</div>
<div style="display: flex; justify-content: space-between; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #6E675C">
<span>Sorted by severity</span>
<span>Last check</span>
</div>
</div>

<section aria-label="Customer list" style="display: flex; flex-direction: column; margin: 0 16px 24px; background: #FFFFFF; border: 1px solid #E2DBCD">
<sc-for list="{{rows}}" as="c" hint-placeholder-count="10">
<a href="Customer.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 66px; padding: 10px 12px 10px 14px; border-bottom: 1px solid #EFEAE0; color: #1C1A17">
<span style="flex: none; width: 24px; height: 24px; border-radius: 50%; background: {{c.dot}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
<sc-if value="{{c.isFail}}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" aria-hidden="true"><path d="M7 7l10 10"></path><path d="M17 7L7 17"></path></svg></sc-if>
<sc-if value="{{c.isWarn}}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v9"></path><path d="M12 19v.01"></path></svg></sc-if>
<sc-if value="{{c.isPass}}" hint-placeholder-val="{{ true }}"><svg width="12" height="12" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if>
</span>
<div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 5px">
<span style="font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.n}}</span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #5F594F">ETL {{c.etl}} · API {{c.api}}</span>
<div style="height: 3px; background: #EFEAE0"><div style="height: 3px; width: {{c.pct}}; background: {{c.dot}}"></div></div>
</div>
<div style="flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 6px">
<span style="padding: 3px 6px; border: 1px solid {{c.bd}}; background: {{c.tint}}; color: {{c.ink}}; font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase">{{c.word}}</span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #5F594F">{{c.t}}</span>
</div>
</a>
</sc-for>
<sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
<div style="padding: 32px 20px; text-align: center; font-size: 13px; color: #5F594F">No customers match this filter.</div>
</sc-if>
</section>

<nav aria-label="Primary" style="margin-top: auto; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid #E2DBCD; background: #EFEAE0">
<a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; height: 64px; color: #5F594F; border-top: 2px solid transparent">
<svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="7" height="7"></rect><rect x="13" y="4" width="7" height="7"></rect><rect x="4" y="13" width="7" height="7"></rect><rect x="13" y="13" width="7" height="7"></rect></svg>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase">Overview</span>
</a>
<a href="Customers.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; height: 64px; background: #F6E6C8; color: #1C1A17; border-top: 2px solid #B5652E">
<svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7"></path><path d="M18 14.5c1.8.8 3 2.9 3 5.5"></path></svg>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 10.5px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase">Customers</span>
</a>
<a href="Report.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; height: 64px; color: #5F594F; border-top: 2px solid transparent">
<svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"></path><path d="M14 3v5h5"></path><path d="M9 13h7"></path><path d="M9 17h5"></path></svg>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase">Reports</span>
</a>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:1500}}">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: 'all', q: '' };
  }
  renderVals() {
    const S = {
      fail: { word: 'Failed', dot: '#B23B2E', bd: '#B23B2E', tint: '#FBEAE7', ink: '#962F24' },
      warn: { word: 'Warning', dot: '#C08A2B', bd: '#C08A2B', tint: '#FBF1DC', ink: '#7A5A12' },
      pass: { word: 'Passed', dot: '#2E7A4E', bd: '#2E7A4E', tint: '#E6F2EA', ink: '#23633E' }
    };
    const raw = [
      ['Cholamandalam Securities', 'CUST-004', 'fail', '6/8', '31/34', '07:38'],
      ['Nirmal Bang', 'CUST-012', 'fail', '8/8', '40/44', '07:36'],
      ['Alice Blue', 'CUST-003', 'warn', '7/8', '38/38', '07:20'],
      ['Goodwill', 'CUST-005', 'warn', '8/8', '35/36', '07:34'],
      ['Findoc', 'CUST-015', 'warn', '7/8', '29/29', '06:44'],
      ['Trustline Securities', 'CUST-001', 'pass', '8/8', '42/42', '07:39'],
      ['Aditya Birla Money (ABML)', 'CUST-002', 'pass', '8/8', '36/36', '07:39'],
      ['GoPocket', 'CUST-006', 'pass', '8/8', '30/30', '07:38'],
      ['Jainam Broking', 'CUST-007', 'pass', '8/8', '34/34', '07:38'],
      ['IIFL', 'CUST-008', 'pass', '8/8', '44/44', '07:37'],
      ['Integrated', 'CUST-009', 'pass', '8/8', '31/31', '07:37'],
      ['Rmoney', 'CUST-010', 'pass', '8/8', '28/28', '07:37'],
      ['Muthoot Securities', 'CUST-011', 'pass', '8/8', '26/26', '07:36'],
      ['Religare Broking', 'CUST-013', 'pass', '8/8', '40/40', '07:36'],
      ['Bajaj Broking', 'CUST-014', 'pass', '8/8', '38/38', '07:35'],
      ['Indira Securities', 'CUST-016', 'pass', '8/8', '33/33', '07:35'],
      ['Jio BlackRock Broking', 'CUST-017', 'pass', '8/8', '36/36', '07:34']
    ];
    const all = raw.map(([n, id, s, etl, api, t]) => {
      const [a, b] = api.split('/').map(Number);
      const [e, f] = etl.split('/').map(Number);
      const pct = Math.round(((a + e) / (b + f)) * 100) + '%';
      return { n, id, s, etl, api, t, pct, ...S[s], isFail: s === 'fail', isWarn: s === 'warn', isPass: s === 'pass' };
    });
    const count = (k) => all.filter((c) => c.s === k).length;
    const f = this.state.filter;
    const q = this.state.q.trim().toLowerCase();
    const rows = all.filter((c) => (f === 'all' || c.s === f) && (!q || c.n.toLowerCase().includes(q)));
    const defs = [
      { k: 'all', label: 'All', n: all.length, on: '#1C1A17' },
      { k: 'fail', label: 'Failed', n: count('fail'), on: '#B23B2E' },
      { k: 'warn', label: 'Warning', n: count('warn'), on: '#8A6516' },
      { k: 'pass', label: 'Passed', n: count('pass'), on: '#2E7A4E' }
    ];
    const tabs = defs.map((d) => ({
      ...d,
      on: f === d.k ? 'true' : 'false',
      bg: f === d.k ? d.on : '#FFFFFF',
      fg: f === d.k ? '#FFFFFF' : '#1C1A17',
      pick: () => this.setState({ filter: d.k })
    }));
    return { tabs, rows, empty: rows.length === 0, onSearch: (e) => this.setState({ q: e.target.value }) };
  }
}
</script>


</body></html>
