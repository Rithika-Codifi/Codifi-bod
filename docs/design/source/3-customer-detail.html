<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>BOD Monitor — Cholamandalam Securities</title>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap">
<style>
body{margin:0;background:#F3EFE6}
a{color:#1C1A17;text-decoration:none}a:hover{color:#9A5424}
@keyframes bodspin{to{transform:rotate(360deg)}}
</style>
</helmet>
<div style="width: 390px; height: 1760px; box-sizing: border-box; background: #F3EFE6; font-family: Inter, system-ui, sans-serif; color: #1C1A17; display: flex; flex-direction: column">

<header style="display: flex; flex-direction: column; gap: 14px; padding: 10px 16px 18px; border-bottom: 1px solid #E2DBCD">
<div style="display: flex; align-items: center; justify-content: space-between; margin-left: -10px">
<a href="Customers.dc.html" style="display: flex; align-items: center; gap: 2px; height: 44px; padding-right: 8px; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: #5F594F"><svg width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>Customers</a>
</div>
<div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-size: 28px; font-weight: 400; line-height: 1.1">Cholamandalam Securities</h1>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: #6E675C">NSE · BSE · MCX · Web · Mobile · API</span>
</div>
<span style="flex: none; display: inline-flex; align-items: center; padding: 5px 9px; border: 1px solid #B23B2E; background: #FBEAE7; color: #962F24; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase">Failed</span>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: #E2DBCD; border: 1px solid #E2DBCD">
<div style="display: flex; flex-direction: column; gap: 4px; padding: 12px; background: #FFFFFF">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #5F594F">ETL</span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 700">{{etlOk}}<span style="font-size: 13px; color: #6E675C">/8</span></span>
</div>
<div style="display: flex; flex-direction: column; gap: 4px; padding: 12px; background: #FFFFFF">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #5F594F">Modules</span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 700">7<span style="font-size: 13px; color: #6E675C">/9</span></span>
</div>
<div style="display: flex; flex-direction: column; gap: 4px; padding: 12px; background: #FFFFFF">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #5F594F">Last run</span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 700">07:38</span>
</div>
</div>
<div style="display: flex; gap: 10px">
<button sc-camel-on-click="{{retestAll}}" style="flex: 1 1 0; height: 46px; display: flex; align-items: center; justify-content: center; gap: 8px; background: #1C1A17; color: #FFFFFF; border: 0; font-family: 'JetBrains Mono', monospace; font-size: 11.5px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer"><svg width="16" height="16" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.4-5.7"></path><path d="M20 4v5h-5"></path></svg>Retest failed</button>
<a href="Report.dc.html" style="flex: 1 1 0; height: 46px; box-sizing: border-box; border: 1px solid #1C1A17; color: #1C1A17; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-size: 11.5px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase">View report</a>
</div>
</header>

<main style="display: flex; flex-direction: column; gap: 16px; padding: 16px 16px 24px">

<section aria-label="ETL processes" style="display: flex; flex-direction: column; background: #FFFFFF; border: 1px solid #E2DBCD">
<div style="display: flex; align-items: baseline; justify-content: space-between; padding: 16px 16px 12px 18px; border-bottom: 1px solid #E2DBCD">
<h2 style="margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-size: 20px; font-weight: 400">ETL process</h2>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #6E675C">Upload → validate → load</span>
</div>
<sc-for list="{{etl}}" as="e" hint-placeholder-count="8">
<div style="display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 10px 8px 10px 18px; border-bottom: 1px solid #EFEAE0">
<span style="flex: none; width: 10px; height: 10px; border-radius: 50%; background: {{e.dot}}"></span>
<div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 3px">
<span style="font-size: 14px; font-weight: 600">{{e.n}}</span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; line-height: 1.4; color: {{e.metaInk}}">{{e.meta}}</span>
</div>
<span style="flex: none; padding: 3px 6px; border: 1px solid {{e.bd}}; background: {{e.tint}}; color: {{e.ink}}; font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase">{{e.word}}</span>
<button aria-label="Retest {{e.n}}" sc-camel-on-click="{{e.retest}}" style="flex: none; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: transparent; border: 0; color: #1C1A17; cursor: pointer">
<svg width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="{{e.spin}}"><path d="M20 12a8 8 0 1 1-2.4-5.7"></path><path d="M20 4v5h-5"></path></svg>
</button>
</div>
</sc-for>
</section>

<section aria-label="Modules" style="display: flex; flex-direction: column; background: #FFFFFF; border: 1px solid #E2DBCD">
<div style="display: flex; align-items: baseline; justify-content: space-between; padding: 16px 16px 12px 18px; border-bottom: 1px solid #E2DBCD">
<h2 style="margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-size: 20px; font-weight: 400">Modules</h2>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #6E675C">Checks passed</span>
</div>
<sc-for list="{{mods}}" as="m" hint-placeholder-count="9">
<a href="Module.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 66px; padding: 10px 12px 10px 18px; border-bottom: 1px solid #EFEAE0; color: #1C1A17">
<div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
<span style="font-size: 14px; font-weight: 600">{{m.n}}</span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; color: {{m.ink}}">{{m.ok}}/{{m.total}}</span>
</div>
<div style="display: flex; height: 6px; gap: 2px">
<div style="flex: {{m.ok}} 1 0; background: #2E7A4E"></div>
<div style="flex: {{m.warnN}} 1 0; background: #C08A2B"></div>
<div style="flex: {{m.failN}} 1 0; background: #B23B2E"></div>
</div>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #5F594F">{{m.note}}</span>
</div>
<svg width="16" height="16" sc-camel-view-box="0 0 24 24" fill="none" stroke="#6E675C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
</a>
</sc-for>
</section>

</main>

<nav aria-label="Primary" style="margin-top: auto; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid #E2DBCD; background: #EFEAE0">
<a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; height: 64px; color: #5F594F; border-top: 2px solid transparent">
<svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="7" height="7"></rect><rect x="13" y="4" width="7" height="7"></rect><rect x="4" y="13" width="7" height="7"></rect><rect x="13" y="13" width="7" height="7"></rect></svg>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase">Overview</span>
</a>
<a href="Customers.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; height: 64px; background: #F6E6C8; color: #1C1A17; border-top: 2px solid #B5652E">
<svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7"></path><path d="M18 14.5c1.8.8 3 2.9 3 5.5"></path></svg>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 10.5px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase">Customers</span>
</a>
<a href="Report.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; height: 64px; color: #5F594F; border-top: 2px solid transparent">
<svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"></path><path d="M14 3v5h5"></path><path d="M9 13h7"></path><path d="M9 17h5"></path></svg>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase">Reports</span>
</a>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:1760}}">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { run: {} };
    this.timers = [];
  }
  componentWillUnmount() {
    this.timers.forEach((t) => clearTimeout(t));
  }
  retest(keys) {
    const run = { ...this.state.run };
    keys.forEach((k) => { run[k] = 'running'; });
    this.setState({ run });
    this.timers.push(setTimeout(() => {
      const done = { ...this.state.run };
      keys.forEach((k) => { done[k] = 'done'; });
      this.setState({ run: done });
    }, 2200));
  }
  renderVals() {
    const S = {
      fail: { word: 'Failed', dot: '#B23B2E', bd: '#B23B2E', tint: '#FBEAE7', ink: '#962F24' },
      warn: { word: 'Warning', dot: '#C08A2B', bd: '#C08A2B', tint: '#FBF1DC', ink: '#7A5A12' },
      pass: { word: 'Passed', dot: '#2E7A4E', bd: '#2E7A4E', tint: '#E6F2EA', ink: '#23633E' },
      running: { word: 'Running', dot: '#2D5A86', bd: '#2D5A86', tint: '#E4ECF5', ink: '#244B70' }
    };
    const base = [
      { k: 'cm-nse', n: 'Contract master · NSE CM', s: 'pass', meta: '06:02 · 2,418 scrips loaded' },
      { k: 'cm-fo', n: 'Contract master · NSE F&O', s: 'fail', meta: '07:31 · File not found on exchange SFTP' },
      { k: 'cm-bse', n: 'Contract master · BSE', s: 'pass', meta: '06:04 · 5,906 scrips loaded' },
      { k: 'cm-mcx', n: 'Contract master · MCX', s: 'pass', meta: '06:05 · 812 contracts loaded' },
      { k: 'user', n: 'User master upload', s: 'pass', meta: '06:15 · 1,24,880 users synced' },
      { k: 'limits', n: 'Client limits & margin', s: 'warn', meta: '06:40 · 312 rows rejected (invalid UCC)' },
      { k: 'hold', n: 'Holdings upload', s: 'pass', meta: '06:22 · 3,41,509 records' },
      { k: 'bhav', n: 'Bhavcopy / previous close', s: 'pass', meta: '05:48 · NSE, BSE, MCX' }
    ];
    const run = this.state.run;
    const etl = base.map((e) => {
      const r = run[e.k];
      const s = r === 'running' ? 'running' : r === 'done' ? 'pass' : e.s;
      const meta = r === 'running' ? 'Retest in progress…' : r === 'done' ? 'Just now · retest passed' : e.meta;
      return {
        ...e, ...S[s], meta,
        metaInk: s === 'fail' ? '#962F24' : '#5F594F',
        spin: r === 'running' ? 'animation: bodspin 0.9s linear infinite' : '',
        retest: () => this.retest([e.k])
      };
    });
    const etlOk = etl.filter((e) => e.word === 'Passed').length;
    const mods = [
      { n: 'Open API', ok: 31, warnN: 1, failN: 2, note: 'Place / modify order returning 502' },
      { n: 'Risk management (RMS)', ok: 9, warnN: 1, failN: 0, note: 'Limits partly loaded — see ETL' },
      { n: 'Order management (OMS)', ok: 24, warnN: 0, failN: 0, note: 'All exchange gateways logged in' },
      { n: 'Market data feed', ok: 12, warnN: 0, failN: 0, note: 'Tick latency 140 ms avg' },
      { n: 'Web trading', ok: 18, warnN: 0, failN: 0, note: 'Login, watchlist, order flow OK' },
      { n: 'Mobile trading', ok: 18, warnN: 0, failN: 0, note: 'Android & iOS builds checked' },
      { n: 'Back-office sync', ok: 6, warnN: 0, failN: 0, note: 'Trades & ledger sync OK' },
      { n: 'Payments (pay-in / pay-out)', ok: 5, warnN: 0, failN: 0, note: 'Gateway & UPI callbacks OK' },
      { n: 'Notifications', ok: 4, warnN: 0, failN: 0, note: 'SMS, email, push OK' }
    ].map((m) => ({ ...m, total: m.ok + m.warnN + m.failN, ink: m.failN ? '#962F24' : m.warnN ? '#7A5A12' : '#23633E' }));
    const failed = base.filter((e) => e.s !== 'pass').map((e) => e.k);
    return { etl, etlOk, mods, retestAll: () => this.retest(failed) };
  }
}
</script>


</body></html>
